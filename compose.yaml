services:
  backend:
    image: ${IRCORD_BACKEND_IMAGE:-ghcr.io/ircord/ircord-backend:v0.7.4}
    restart: unless-stopped
    env_file:
      - path: ./backend.env
        required: false
    environment:
      IRCORD_PUBLIC_URL: ${IRCORD_PUBLIC_URL:-http://localhost:3000}
      IRCORD_ALLOWED_ORIGINS: ${IRCORD_PUBLIC_URL:-http://localhost:3000}
      IRCORD_TRUSTED_PROXIES: ${IRCORD_TRUSTED_PROXIES:-${IRCORD_NETWORK_SUBNET:-172.30.80.0/28}}
      IRCORD_DATA_DIR: /data
      IRCORD_LISTEN: 0.0.0.0:8080
    volumes:
      - backend-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [application, voice]

  frontend:
    image: ${IRCORD_FRONTEND_IMAGE:-ghcr.io/ircord/ircord-frontend:v0.7.3}
    restart: unless-stopped
    env_file:
      - path: ./frontend.env
        required: false
    environment:
      NUXT_BACKEND_URL: http://backend:8080
      NUXT_SITE_URL: ${IRCORD_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${IRCORD_BIND_ADDRESS:-127.0.0.1}:${IRCORD_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [application]

  livekit:
    profiles: [voice]
    image: livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    env_file:
      - path: ./voice.env
        required: false
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          udp_port: 7882
          tcp_port: 0
          use_external_ip: false
          node_ip: ${IRCORD_VOICE_MEDIA_ADDRESS:-127.0.0.1}
          enable_loopback_candidate: ${IRCORD_VOICE_LOOPBACK:-true}
        room:
          max_participants: 8
        logging:
          level: warn
    ports:
      - "${IRCORD_VOICE_BIND_ADDRESS:-127.0.0.1}:7882:7882/udp"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [voice]

networks:
  application:
    ipam:
      config:
        - subnet: ${IRCORD_NETWORK_SUBNET:-172.30.80.0/28}
  voice:

volumes:
  backend-data:
