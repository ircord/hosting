publicUrl: http://localhost:3000
imagePullSecrets: []

# Use one backend replica with an exclusive persistent volume.
backend:
  image:
    repository: ghcr.io/ircord/ircord-backend
    tag: v0.7.4
    digest: ""
  persistence:
    existingClaim: ""
    storageClass: ""
    size: 10Gi
  trustedProxies: ""
  fileStorage: local
  env: {}
  envFrom: []
  envRefs: []
  annotations: {}
  podLabels: {}
  extraVolumeMounts: []
  extraVolumes: []
  resources: {}

frontend:
  replicas: 1
  image:
    repository: ghcr.io/ircord/ircord-frontend
    tag: v0.7.3
    digest: ""
  env: {}
  envFrom: []
  envRefs: []
  annotations: {}
  podLabels: {}
  resources: {}

website:
  enabled: false
  replicas: 1
  # The existing website release includes its own static changelog.
  image:
    repository: ghcr.io/karbowiak/ircord-website
    tag: v0.7.2
    digest: ""
  env: {}
  envFrom: []
  envRefs: []
  annotations: {}
  podLabels: {}
  resources: {}

ingress:
  driver: ingress
  certificates:
    issuerRef: {}
    renewBefore: ""
    privateKey: {}
  traefik:
    httpEntryPoint: web
    httpsEntryPoint: websecure
  app: {enabled: false, className: "", host: "", aliases: [], tlsSecret: "", annotations: {}, directBackend: false}
  website: {enabled: false, className: "", host: "", aliases: [], tlsSecret: "", annotations: {}}
  media: {enabled: false, className: "", host: "", aliases: [], tlsSecret: "", annotations: {}}

# Optional secret sync via an installed Infisical operator. Paths map the name
# of a Secret in the release namespace to an Infisical folder.
infisical:
  hostAPI: ""
  resyncInterval: 60
  projectSlug: ""
  envSlug: ""
  credentialsRef: {secretName: "", secretNamespace: ""}
  paths: {}

media:
  # disabled, external, or bundled. Bundled uses RustFS and a read-only gateway.
  mode: disabled
  endpoint: ""
  publicUrl: ""
  bucket: ircord-media
  prefix: media
  region: us-east-1
  credentials:
    existingSecret: ""
    accessKey: access-key
    secretKey: secret-key
    sessionTokenKey: ""
  rustfs:
    image: {repository: rustfs/rustfs, tag: "1.0.4", digest: ""}
    persistence: {existingClaim: "", storageClass: "", size: 50Gi}
    resources: {}
  gateway:
    image: {repository: nginxinc/nginx-unprivileged, tag: "1.30-alpine", digest: ""}
    resources: {}
  toolingImage: {repository: public.ecr.aws/aws-cli/aws-cli, tag: "2.39.6", digest: ""}
  lifecycle:
    enabled: false
    schedule: "17 4 * * *"
    timeZone: Etc/UTC
    days: 90
    expirationRuleID: ircord-linked-media-expiry
    deleteMarkerRuleID: ircord-linked-media-delete-markers

# Configure an external IRC server through backend.env and backend.envFrom.
# Enable this section to run a compatible Ergo instance alongside IRCord.
ergo:
  enabled: false
  hostname: ""
  image: {repository: ghcr.io/ergochat/ergo, tag: v2.19.1, digest: ""}
  persistence: {existingClaim: "", storageClass: "", size: 10Gi}
  tlsSecret: ""
  caSecret: ""
  caKey: ca.crt
  existingConfigMap: ""
  apiTokenSecret: ""
  apiTokenKey: api-token
  service:
    type: ClusterIP
    port: 6697
    annotations: {}
  apiNetworkPolicy: true
  envFrom: []
  resources: {}

# Server-owner moderation lets server owners delete other people's messages and
# mark bots. The backend logs in to Ergo as this operator. Provide an existing
# Secret holding the operator password. With the bundled Ergo configuration, the
# chart adds the operator and hashes the password when Ergo starts.
moderation:
  enabled: false
  operator: ircord-moderation
  existingSecret: ""
  passwordKey: password

# Serve this instance's file host to the whole IRC network, at publicUrl + /files/.
# Other instances on the network can then store the files their users post here,
# and IRC clients that support the FILEHOST draft can upload, as the backend allows.
# Needs a backend release with the network file host, and ergo.enabled
# or an external Ergo server that checks the logins. With the bundled Ergo
# configuration the chart advertises the address; with ergo.existingConfigMap or an
# external server, add the advertisement yourself (see the README).
fileHost:
  enabled: false

# The control and signaling port always stays on the private cluster network.
voice:
  enabled: false
  channels: []
  image:
    repository: livekit/livekit-server
    tag: v1.13.11
    digest: sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
  credentials:
    existingSecret: ""
    apiKey: IRCORD_VOICE_API_KEY
    secretKey: IRCORD_VOICE_API_SECRET
  media:
    enabled: false
    # Address clients can reach on UDP 7882. Use the router or load balancer address.
    address: ""
    annotations: {}
  resources: {}

cachePurge:
  enabled: false
  hostname: ""
  existingSecret: ""
  tokenKey: api-token
  zoneKey: zone-id
  image: {repository: alpine/k8s, tag: "1.37.2", digest: ""}
